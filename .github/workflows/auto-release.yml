name: Manual fork release

on:
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: monthly-upstream-sync
    cancel-in-progress: false

jobs:
    release:
        if: github.repository == 'muzi-xiaoren/Microsoft-Rewards-Script'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: V4-china
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Build and release this fork
              env:
                  GH_TOKEN: ${{ github.token }}
                  SYNC_REPOSITORY: ${{ github.repository }}
              run: node scripts/github/release-fork.mjs
