name: Monthly upstream code and releases

on:
    schedule:
        # 08:17 Asia/Shanghai on the first day of each month.
        - cron: '17 0 1 * *'
    workflow_dispatch:

permissions:
    contents: write

concurrency:
    group: monthly-upstream-sync
    cancel-in-progress: false

jobs:
    sync:
        if: github.repository == 'muzi-xiaoren/Microsoft-Rewards-Script'
        runs-on: ubuntu-latest
        timeout-minutes: 30
        steps:
            - uses: actions/checkout@v4
              with:
                  ref: V4-china
                  fetch-depth: 0
            - uses: actions/setup-node@v4
              with:
                  node-version: 24
            - name: Merge upstream and mirror releases without publishing images
              env:
                  GH_TOKEN: ${{ github.token }}
                  SYNC_REPOSITORY: ${{ github.repository }}
              run: node scripts/github/sync-upstream.mjs
